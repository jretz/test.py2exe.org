[project]
site_name = "py2exe"
site_url = "https://test.py2exe.org/"
docs_dir = "content"
site_dir = "site"
# Leave repo_url empty to hide the theme's built-in repository link.
# Zensical appends each page's Markdown path to edit_uri, which points to
# GitHub's commit history. The footer uses this URL for Page history.
# The theme's Edit and View buttons are disabled separately.
repo_url = ""
edit_uri = "https://github.com/jretz/test.py2exe.org/commits/main/content/"
extra_css = ["assets/stylesheets/extra.css"]
strict = true

[project.theme]
custom_dir = "overrides"
favicon = "assets/py2exe-avatar.svg"
logo = "assets/logo.png"
font = false
features = ["search.highlight"]

[project.plugins.exclude]
glob = [
    "assets/images/favicon.png",
    "assets/stylesheets/classic/*.css",
    "assets/stylesheets/modern/palette.*.min.css",
]

[project.extra]
generator = false
resource_links = [
    { label = "Tutorial", url = "getting-started/tutorial/", internal = true },
    { label = "Recent Changes", url = "recent-changes/", internal = true, require_page = true },
    { label = "Download (Python 3)", url = "https://pypi.org/project/py2exe/" },
    { label = "Download (Python 2)", url = "https://sourceforge.net/projects/py2exe/files/py2exe/0.6.9/" },
    { label = "Mailing List", url = "https://lists.sourceforge.net/lists/listinfo/py2exe-users" },
    { label = "Source Code", url = "https://github.com/py2exe/py2exe" },
]

